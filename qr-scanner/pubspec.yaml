name: qr_code_reader
description: >
  Minimalist Flutter QR code scanner with live camera scanning, gallery import,
  date-grouped history, favorites, batch delete, and safe URL preview.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.5.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
